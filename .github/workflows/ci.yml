name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Verify container build
        run: docker build -t kestrel-api:ci .

  go-storage:
    name: Storage plane (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build storage engine
        run: go build ./...
        working-directory: engine
      - name: Vet storage engine
        run: go vet ./...
        working-directory: engine
      - name: Test storage engine
        run: go test ./...
        working-directory: engine
      - name: Build gateway
        run: go build ./...
        working-directory: gateway
      - name: Vet gateway
        run: go vet ./...
        working-directory: gateway

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
