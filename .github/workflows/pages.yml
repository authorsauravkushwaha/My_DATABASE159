name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the two jobs below: read the repository, publish a Pages
# artifact, and mint the OIDC token actions/deploy-pages exchanges for one.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build workspace website
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: bash scripts/build-site.sh
      - uses: actions/configure-pages@v6
        with:
          # The repository owner enables Pages once from Settings → Pages when this
          # is not permitted by the token. `enablement: true` lets the workflow do it
          # when the repository allows the token to manage Pages.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dashboard/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
