name: kestrel
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestrel
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/setup.sh first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://kestrel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kestrel
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      APP_ENV: development
      AUTO_CREATE_SCHEMA: "false"
      DATABASE_URL: postgresql+psycopg://kestrel:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kestrel
      JWT_SECRET: ${JWT_SECRET:?Run bash scripts/setup.sh first}
      STORAGE_ENGINE_ADDR: storage:9100
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:8080"
    restart: unless-stopped

  storage:
    build: ./engine
    environment:
      ENGINE_SHARDS: "4"
      ENGINE_MEMTABLE_MB: "8"
      ENGINE_CACHE_MB: "64"
    volumes:
      - storage_data:/data
    restart: unless-stopped

  gateway:
    build: ./gateway
    environment:
      CONTROL_PLANE_URL: http://api:8000
    depends_on:
      storage:
        condition: service_started
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
    restart: unless-stopped

volumes:
  postgres_data:
  storage_data:
